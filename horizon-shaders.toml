# Nimbe: an original shader pack for Horizon (Minecraft Rust Edition).
schema = 1
id = "nimbe"
name = "Nimbe"
version = "1.0.0"
api = "0.1"
description = "A bright, enchanting world: painted sky, volumetric clouds, sunbeams, soft shadows, living water and colored lights."
authors = ["Reminuscul"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky and clouds"
clouds = false
sun = false
stars = false

[material]
file = "material.wgsl"
name = "Materials and lighting"
fog = false

[vertex]
file = "vertex.wgsl"
name = "Wind"

[weather]
file = "weather.wgsl"
name = "Rain and snow"

[shadow]
resolution = 2048
distance = 128.0
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[reflection]
option = "reflections"

[[post]]
file = "post/volumetric.wgsl"
name = "Shafts and occlusion"
output = "volumetrics"
scale = 0.5

[[post]]
file = "post/denoise.wgsl"
name = "Volumetric smoothing"
output = "volumetrics_soft"
scale = 0.5

[[post]]
file = "post/composite.wgsl"
name = "Atmosphere"

[[post]]
file = "post/bloom_extract.wgsl"
name = "Bloom (extract)"
output = "bloom_half"
scale = 0.5

[[post]]
file = "post/bloom_blur.wgsl"
name = "Bloom (blur)"
output = "bloom_quarter"
scale = 0.25

[[post]]
file = "post/grade.wgsl"
name = "Color grading"

[[post]]
file = "post/antialias.wgsl"
name = "Anti-aliasing"

[budget]
gpu_ms = 9.0

# ---- Textures ------------------------------------------------------------------------------

[[textures]]
id = "noise"
file = "textures/noise.png"
filter = "linear"
wrap = "repeat"

# ---- Pages d'options -----------------------------------------------------------------------

[[pages]]
id = "main"
name = "Nimbe"
columns = 1
items = ["page:lumiere", "page:ciel", "page:eau", "page:matieres", "page:atmosphere", "page:image"]

[[pages]]
id = "lumiere"
name = "Lighting"
description = "Shadows, sunlight and block light."
items = ["shadows", "shadow_resolution", "shadow_distance", "shadow_softness", "sun_strength", "ambient_strength", "torch_warmth", "cave_light", "colored_lights", ""]

[[pages]]
id = "ciel"
name = "Sky"
description = "Clouds, stars and auroras."
items = ["cloud_amount", "cloud_quality", "stars_amount", "aurora"]

[[pages]]
id = "eau"
name = "Water"
description = "Reflections, clarity and waves."
items = ["water_style", "reflections", "sun_glint", "water_clarity", "water_waves", "caustics"]

[[pages]]
id = "matieres"
name = "Materials"
description = "Relief, plants and wet surfaces."
items = ["relief", "pbr", "subsurface", "waving", "rain_puddles", ""]

[[pages]]
id = "atmosphere"
name = "Atmosphere"
description = "Light shafts, haze and occlusion."
items = ["volumetric", "volumetric_quality", "volumetric_strength", "haze", "ao_strength", ""]

[[pages]]
id = "image"
name = "Image"
description = "Bloom, color and sharpness."
items = ["bloom", "exposure", "saturation", "contrast", "vignette", "antialias"]

# ---- Lumière -------------------------------------------------------------------------------

[[options]]
id = "shadows"
name = "Shadows"
description = "Casts shadows from the sun and moon. Turning this off gives the biggest frame-rate gain."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow resolution"
description = "Shadow map size, in texels."
type = "choice"
values = ["1024", "2048", "4096"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "How far the shadow map reaches, in blocks."
type = "choice"
values = ["64", "128", "192", "256"]
default = "128"

[[options]]
id = "shadow_softness"
name = "Shadow softness"
description = "0: crisp edges like the blocks. Higher: a wider penumbra."
type = "float"
default = 0.6
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "sun_strength"
name = "Sun strength"
type = "float"
default = 1.0
min = 0.2
max = 2.0
step = 0.05

[[options]]
id = "ambient_strength"
name = "Skylight"
type = "float"
default = 1.0
min = 0.2
max = 2.0
step = 0.05

[[options]]
id = "torch_warmth"
name = "Torch warmth"
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cave_light"
name = "Cave brightness"
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "colored_lights"
name = "Colored lights"
description = "Gives soul torches, redstone, amethyst and other sources their own color."
type = "bool"
default = true

# ---- Ciel ----------------------------------------------------------------------------------

[[options]]
id = "cloud_amount"
name = "Cloud amount"
type = "float"
default = 0.55
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_quality"
name = "Cloud quality"
type = "choice"
values = ["Low", "Medium", "High"]
default = "Medium"

[[options]]
id = "stars_amount"
name = "Stars"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "aurora"
name = "Auroras"
description = "Veils of light in the sky on cold nights."
type = "bool"
default = true

# ---- Eau -----------------------------------------------------------------------------------

[[options]]
id = "reflections"
name = "Water reflections"
description = "Reflecting the world in water means drawing it a second time."
type = "bool"
default = true

[[options]]
id = "water_style"
name = "Water color"
description = "Turquoise: emerald in the shallows, deep teal further out. Biome: Minecraft's colors."
type = "choice"
values = ["Turquoise", "Biome"]
default = "Turquoise"

[[options]]
id = "sun_glint"
name = "Sun glint"
description = "Sun glitter on water: sharp up close, stretched into a path of light in the distance."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "water_clarity"
name = "Water clarity"
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_waves"
name = "Waves"
description = "Height of the swell. 0: perfectly still water."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "caustics"
name = "Underwater light"
description = "Dancing patterns of light on lake beds."
type = "bool"
default = true

# ---- Matières ------------------------------------------------------------------------------

[[options]]
id = "relief"
name = "Texture relief"
description = "Derives subtle relief from textures, even without a PBR resource pack."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "pbr"
name = "LabPBR maps"
description = "Uses normal and specular maps from resource packs that provide them."
type = "bool"
default = true

[[options]]
id = "subsurface"
name = "Light through foliage"
type = "float"
default = 0.8
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "waving"
name = "Wind and current"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "rain_puddles"
name = "Wet ground"
description = "Surfaces glisten and puddles form in the rain."
type = "float"
default = 0.8
min = 0.0
max = 1.0
step = 0.05

# ---- Atmosphère ----------------------------------------------------------------------------

[[options]]
id = "volumetric"
name = "Light shafts"
type = "bool"
default = true

[[options]]
id = "volumetric_quality"
name = "Light shaft quality"
type = "choice"
values = ["Low", "Medium", "High"]
default = "Medium"

[[options]]
id = "volumetric_strength"
name = "Light shaft intensity"
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "haze"
name = "Distant haze"
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "ao_strength"
name = "Ambient occlusion"
description = "Gently darkens corners and crevices."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

# ---- Image ---------------------------------------------------------------------------------

[[options]]
id = "bloom"
name = "Bloom"
type = "float"
default = 0.7
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.5
max = 1.6
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.12
min = 0.0
max = 2.0
step = 0.02

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.06
min = 0.7
max = 1.5
step = 0.02

[[options]]
id = "vignette"
name = "Vignette"
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "antialias"
name = "Anti-aliasing"
description = "Smooths edges. The game's own anti-aliasing settings do nothing while a pack draws the image."
type = "bool"
default = true

